# main -> production, after you approve the run in GitHub
# (environment "production" has you as a required reviewer).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  production:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      tf_dir: infra/envs/prod/site
      site_url: https://boutiquedemariamx.com
      role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    secrets: inherit
