# Pull requests: build, test, preview production's Terraform changes, and
# deploy the branch to staging.boutiquedemariamx.com to try it for real.
name: ci

on:
  pull_request:

permissions:
  id-token: write # OIDC tokens for AWS
  contents: read

# No run-level cancel-in-progress: cancelling would kill a staging
# `terraform apply` halfway. deploy-env.yml queues staging deploys instead.

jobs:
  web:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  lambdas:
    name: Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # same as the Lambda runtime
      - run: node --test lambdas/*/test/*.test.mjs

  plan-prod:
    name: Terraform plan (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # adds -o pipefail, so a failed plan fails the job even through `tee`
        working-directory: infra/envs/prod/site
    env:
      TF_IN_AUTOMATION: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_admins: ${{ vars.ADMINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }} # read-only
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive ../../../

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan (production)"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Staging
    needs: [web, lambdas]
    # Pull requests from forks get no AWS access; only this repo's branches deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      tf_dir: infra/envs/staging/site
      site_url: https://staging.boutiquedemariamx.com
      role_arn: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
    secrets: inherit
