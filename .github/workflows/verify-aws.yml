# M0 check: proves GitHub Actions can reach AWS through OIDC with no stored keys.
# Pull requests use the read-only plan role; main uses the deploy role.
name: verify-aws

# Manual only now that deploy.yml exists. Handy for checking OIDC claims.
on:
  workflow_dispatch:

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Pick role
        id: role
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "arn=${{ vars.AWS_PLAN_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          else
            echo "arn=${{ vars.AWS_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          fi

      # Prints only the token's claims (never the token). The trust policies in
      # infra/bootstrap/main.tf must match `sub` exactly.
      - name: Show OIDC token claims (debug)
        run: |
          curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k: c.get(k) for k in ["sub","aud","ref","event_name"]}, indent=2))'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity
