# Reusable: deploy one environment (staging or production).
# Called by ci.yml (pull requests -> staging) and deploy.yml (main -> production).
#
# `environment:` decides everything security-wise. GitHub puts its name in the
# OIDC token ("...:environment:production"), and each account's github-deploy
# role trusts exactly one name. For production, GitHub also waits for your
# approval before this job starts.
name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment: staging or production"
        required: true
        type: string
      tf_dir:
        description: "Terraform root, e.g. infra/envs/prod/site"
        required: true
        type: string
      site_url:
        required: true
        type: string
      role_arn:
        description: "github-deploy role in that environment's AWS account"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site_url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_admins: ${{ vars.ADMINS }}
    steps:
      # Actions are pinned to exact commits; the comment is the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: ${{ inputs.tf_dir }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          {
            echo "BUCKET=$(terraform output -raw site_bucket)"
            echo "DIST_ID=$(terraform output -raw distribution_id)"
            echo "PUBLIC_AUTH_DOMAIN=$(terraform output -raw auth_domain)"
            echo "PUBLIC_AUTH_CLIENT_ID=$(terraform output -raw auth_client_id)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: npm ci && npm run build # reads PUBLIC_AUTH_* from the apply step

      - name: Upload site
        working-directory: web/dist
        run: |
          # Fingerprinted assets never change: cache them for a year.
          if [ -d _astro ]; then
            aws s3 sync _astro "s3://$BUCKET/_astro" --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi
          # Everything else: browsers re-check each time; CloudFront keeps it
          # for a day, and the invalidation below refreshes it on every deploy.
          # media/ holds product photos uploaded from the admin page: never
          # part of the build, so --delete must not touch it.
          aws s3 sync . "s3://$BUCKET" --delete --exclude "_astro/*" --exclude "media/*" \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      - name: Refresh CDN cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Smoke test
        env:
          SITE: ${{ inputs.site_url }}
        run: |
          sleep 20
          curl -fsS "$SITE/" | grep -q "Boutique de María"
          curl -fsS -o /dev/null "$SITE/auth/callback"
          # The API must refuse a request without a sign-in token.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/catalog")
          [ "$code" = "401" ] || { echo "Expected 401 from /api/catalog, got $code"; exit 1; }
          echo "$SITE is up."
